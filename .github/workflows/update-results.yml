name: Atualizar resultados

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-diamond-league-results
  cancel-in-progress: false

env:
  DATA_BRANCH: atualizacao-automatica-de-dados

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar branch de dados
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          fetch-depth: 0

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Atualizar resultados oficiais
        run: pnpm ingest

      - name: Validar dados gerados
        run: pnpm validate:data

      - name: Verificar código
        run: pnpm lint

      - name: Compilar aplicação
        run: pnpm build

      - name: Verificar alterações nos resultados
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- lib/diamond-league/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração oficial encontrada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar resultados atualizados
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/diamond-league/generated
          git commit -m "data: atualizar resultados oficiais"
          git push origin "HEAD:${DATA_BRANCH}"
